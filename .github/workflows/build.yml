name: build

# Ships INTO the instantiated (per-user) repo. There, play-publisher has already
# substituted every {{TOKEN}}, so this builds the real app and fails loudly if a
# token was missed. In the TEMPLATE repo itself the tokens are still present, so
# the build jobs skip (the template's own buildability is proven by template-smoke.yml).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      instantiated: ${{ steps.check.outputs.instantiated }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -rlq '{{' app twa-manifest.json 2>/dev/null; then
            echo "Uninstantiated template (placeholders present) — the real build runs post-instantiation."
            echo "instantiated=false" >> "$GITHUB_OUTPUT"
          else
            echo "instantiated=true" >> "$GITHUB_OUTPUT"
          fi

  debug-apk:
    needs: guard
    if: needs.guard.outputs.instantiated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-aab:
    needs: [ guard, debug-apk ]
    if: >-
      needs.guard.outputs.instantiated == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret set — skipping the signed release build."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release AAB
        if: steps.keystore.outputs.present == 'true'
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Upload AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
